<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <title>Lakin Wecker's Avatar</title>
    <link rel="shortcut icon" type="image/png" href="/avatar/favicon.png"/>
    <script>
      (function () {
        var theme = localStorage.getItem('theme') || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
      })();
    </script>
<style>
    /* Open-Props palette values matching lakin.ca's theming. */
    :root {
      color-scheme: light dark;
      --surface: #f8f9fa;     /* gray-0 */
      --text:    #212529;     /* gray-9 */
      --primary: #228be6;     /* blue-6 */
      --accent:  #ffd43b;     /* yellow-4 */
      --border:  #dee2e6;     /* gray-4 */
    }
    @media (prefers-color-scheme: dark) {
      :root:not(.light) {
        --surface: #212529;   /* gray-9 */
        --text:    #f8f9fa;   /* gray-0 */
        --primary: #74c0fc;   /* blue-4 */
        --accent:  #ffe066;   /* yellow-3 */
        --border:  #495057;   /* gray-7 */
      }
    }
    :root.dark {
      --surface: #212529;
      --text:    #f8f9fa;
      --primary: #74c0fc;
      --accent:  #ffe066;
      --border:  #495057;
    }

    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
      box-sizing: border-box;
      background: var(--surface);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    /* Decorative color stripes top and bottom — primary and accent. */
    body::before, body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(
        to right,
        var(--primary) 0 40%,
        var(--accent) 40% 60%,
        var(--primary) 60% 100%
      );
    }
    body::before { top: 0; }
    body::after { bottom: 0; }

    [data-avatar] {
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid var(--border);
      content-visibility: auto;
    }

    /* .board / .cell styles live in src/avatar.css and ship with the bundle. */
</style>
</head>
<body>
    <noscript>
        You need to enable JavaScript to run this app.
    </noscript>

    <!-- Large: 400x400, 36px cells (3× default ~12px) → 11×11 grid -->
    <div data-avatar data-cell-size="36" style="width:400px;height:400px"></div>

    <!-- Medium: 200x200, 16x16 grid -->
    <div data-avatar data-grid-size="16" style="width:200px;height:200px"></div>

    <!-- Small: 100x100, fixed 8px cells -->
    <div data-avatar data-cell-size="8" style="width:100px;height:100px"></div>

    <!-- Wide banner: 600x150 -->
    <div data-avatar data-grid-size="12" style="width:600px;height:150px"></div>

    <!-- Tiny icon: 48x48, 4px cells (0.66× of 6px) → 12×12 grid -->
    <div data-avatar data-cell-size="4" style="width:48px;height:48px"></div>


    <script type="module" src="/src/index.js"></script>
</body>
</html>
