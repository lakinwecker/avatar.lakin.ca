<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <title>Lakin Wecker's Avatar</title>
    <link rel="shortcut icon" type="image/png" href="/avatar/favicon.png"/>
<style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      box-sizing: border-box;
      background: #1a1a1a;
    }
    [data-avatar] {
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid white;
      content-visibility: auto;
    }

    /* .board / .cell styles live in src/avatar.css and ship with the bundle. */
</style>
</head>
<body>
    <noscript>
        You need to enable JavaScript to run this app.
    </noscript>

    <!-- Large: 400x400, 36px cells (3× default ~12px) → 11×11 grid -->
    <div data-avatar data-cell-size="36" style="width:400px;height:400px"></div>

    <!-- Medium: 200x200, 16x16 grid -->
    <div data-avatar data-grid-size="16" style="width:200px;height:200px"></div>

    <!-- Small: 100x100, fixed 8px cells -->
    <div data-avatar data-cell-size="8" style="width:100px;height:100px"></div>

    <!-- Wide banner: 600x150 -->
    <div data-avatar data-grid-size="12" style="width:600px;height:150px"></div>

    <!-- Tiny icon: 48x48, 4px cells (0.66× of 6px) → 12×12 grid -->
    <div data-avatar data-cell-size="4" style="width:48px;height:48px"></div>


    <script type="module" src="/src/index.js"></script>
</body>
</html>
