<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <title>Lakin Wecker's Avatar</title>
    <link rel="shortcut icon" type="image/png" href="/avatar/favicon.png"/>
<style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      box-sizing: border-box;
      background: #1a1a1a;
    }
    [data-avatar] {
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid white;
      content-visibility: auto;
    }

    .board {
      display: grid;
      place-content: center;
      overflow: hidden;
      background-color: rgb(0, 127, 177);
    }
    .cell { --animate-duration: 0.5s; }
    .cell.animate__animated { will-change: transform, opacity; }
    .cell.animate__zoomIn,
    .cell.animate__zoomOut { animation-timing-function: ease-out; }
</style>
</head>
<body>
    <noscript>
        You need to enable JavaScript to run this app.
    </noscript>

    <!-- Large: 400x400, default 32x32 grid -->
    <div data-avatar style="width:400px;height:400px"></div>

    <div data-avatar data-cell-size="6" style="width:48px;height:48px"></div>
    -->


    <script type="module" src="/src/index.js"></script>
</body>
</html>
